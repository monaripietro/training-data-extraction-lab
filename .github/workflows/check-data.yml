name: check-data

on:
  push:
  pull_request:

jobs:
  check-data:
    name: Protezioni sui dati (CA8)
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository con la cronologia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test dello script di controllo
        run: bash tests/test_check_no_pile.sh
      - name: Test dello script dei prefissi (solo dati sintetici)
        run: python3 -m unittest discover tests
      - name: Controlla l'albero finale
        run: bash scripts/check_no_pile.sh --tree
      - name: Controlla ogni commit della pull request
        if: github.event_name == 'pull_request'
        run: bash scripts/check_no_pile.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Controlla ogni commit del push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bash scripts/check_no_pile.sh --range "${{ github.event.before }}..${{ github.sha }}"
