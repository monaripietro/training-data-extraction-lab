name: dashboard

# Aggiorna il corpo dell'issue con l'etichetta «dashboard» a ogni cambiamento di
# issue o pull request, e comunque ogni ora. Le modifiche fatte con GITHUB_TOKEN
# non avviano altri workflow, quindi non si crea un ciclo.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft, edited]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  update:
    name: Aggiorna la dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna l'issue della dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/dashboard.py
