name: pages

on:
  workflow_run:
    workflows: ["check-data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy di site/ su GitHub Pages
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Carica solo la cartella site/
        if: hashFiles('site/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pubblica su GitHub Pages
        if: hashFiles('site/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4
